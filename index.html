<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi YouTube Player · Shorts + Proxy</title>
  <script src="https://www.youtube.com/iframe_api"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* --- Global Styles --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 2rem;
      color: #00ffcc;
      text-shadow: 0 0 5px #00ffcc88;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    h1 i {
      font-size: 2rem;
    }

    .subhead {
      color: #aaa;
      margin-bottom: 20px;
      font-size: 1rem;
      text-align: center;
      max-width: 600px;
      border-left: 3px solid #00ffcc55;
      padding-left: 12px;
    }

    label, input, button {
      font-size: 1rem;
      margin: 8px 0;
      display: block;
      color: #ddd;
    }

    input[type="text"],
    input[type="number"],
    select {
      padding: 8px;
      background-color: #1e1e1e;
      color: white;
      border: 1px solid #333;
      border-radius: 4px;
      width: 300px;
      transition: border 0.2s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: #00ffcc;
      outline: none;
    }

    select {
      cursor: pointer;
    }

    button {
      padding: 10px 20px;
      background-color: #00ffcc;
      border: none;
      border-radius: 4px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s, transform 0.1s;
    }

    button:hover {
      background-color: #00cca3;
    }

    button:active {
      transform: scale(0.97);
    }

    #players {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 30px;
      justify-content: center;
    }

    .player-container {
      border: 2px solid #00ffcc33;
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 10px #00ffcc33;
      background: #0a0a0a;
      position: relative;
    }

    .player-container:hover {
      transform: scale(1.03);
      box-shadow: 0 0 15px #00ffcc88;
    }

    /* Proxy indicator on each player */
    .proxy-tag {
      position: absolute;
      top: 5px;
      left: 5px;
      background: #ffaa00cc;
      color: #000;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      z-index: 10;
      pointer-events: none;
    }

    .short-badge {
      display: inline-block;
      background: #ff0055;
      color: white;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 8px;
      vertical-align: middle;
      font-weight: 600;
    }

    footer {
      margin-top: auto;
      padding: 20px;
      color: #888;
      font-size: 0.9rem;
      text-align: center;
      border-top: 1px solid #333;
      width: 100%;
    }

    .discord-link {
      position: fixed;
      top: 15px;
      right: 15px;
      font-size: 1.5rem;
      color: #7289da;
      text-decoration: none;
      transition: transform 0.2s, color 0.2s;
      z-index: 9999;
    }

    .discord-link:hover {
      color: #99aab5;
      transform: scale(1.2);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
    }

    .proxy-section {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      width: 300px;
    }

    .proxy-section h3 {
      font-size: 0.9rem;
      color: #00ffcc;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .proxy-status {
      font-size: 0.75rem;
      margin-top: 6px;
      color: #888;
    }

    .proxy-status.active {
      color: #00ffcc;
    }

    .info-pill {
      background: #1e1e1e;
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 0.9rem;
      color: #00ffccaa;
      border: 1px solid #00ffcc33;
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }

    .checkbox-row input[type="checkbox"] {
      width: auto;
      margin: 0;
      cursor: pointer;
      accent-color: #00ffcc;
    }

    .checkbox-row label {
      margin: 0;
      cursor: pointer;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <a class="discord-link" href="https://discord.gg/pc3hazBxBB" target="_blank" title="Join our Discord!">
    <i class="fab fa-discord"></i>
  </a>

  <h1>
    <i class="fas fa-play-circle"></i> 
    Multi YouTube Player 
    <span class="short-badge">Shorts</span>
  </h1>
  <div class="subhead">
    <i class="fas fa-mobile-alt"></i> Paste any YouTube link — including Shorts — with optional proxy routing.
  </div>

  <div class="input-group">
    <label for="videoURL"><i class="fas fa-link"></i> YouTube Video / Shorts URL:</label>
    <input type="text" id="videoURL" placeholder="https://youtube.com/shorts/... or https://youtu.be/..." value="https://youtu.be/-rU9WUzfZZo" />

    <label for="numVideos"><i class="fas fa-hashtag"></i> Number of Videos (1-20):</label>
    <input type="number" id="numVideos" min="1" max="20" value="4" />

    <!-- Proxy Configuration Section -->
    <div class="proxy-section">
      <h3><i class="fas fa-shield-halved"></i> Proxy Settings</h3>
      
      <div class="checkbox-row">
        <input type="checkbox" id="useProxy" />
        <label for="useProxy">Enable Proxy Routing</label>
      </div>

      <label for="proxyType" style="font-size: 0.85rem; margin-top: 4px;">Proxy Type:</label>
      <select id="proxyType" style="width: 100%;">
        <option value="invidious">Invidious (Public Instances)</option>
        <option value="piped">Piped (Privacy Frontend)</option>
        <option value="custom">Custom Proxy URL</option>
        <option value="corsproxy">CORS Proxy (video only)</option>
        <option value="proxyscrape">ProxyScrape (Free Proxy List)</option>
      </select>

      <label for="customProxy" style="font-size: 0.85rem; margin-top: 8px;">Custom Proxy URL (if selected):</label>
      <input type="text" id="customProxy" placeholder="https://your-proxy.com/" style="width: 100%; font-size: 0.85rem;" />

      <div class="proxy-status" id="proxyStatus">
        <i class="fas fa-circle" style="font-size: 0.5rem;"></i> Proxy disabled
      </div>
    </div>

    <button id="loadBtn"><i class="fas fa-sync-alt"></i> Load Videos</button>
  </div>

  <div id="players"></div>

  <footer>
    Made by <strong>SunilGaming</strong> · Supports YouTube Shorts & Proxy
  </footer>

  <script>
    let players = [];
    let ytApiReady = false;

    // ----- Proxy Configuration -----
    const PROXY_CONFIG = {
      enabled: false,
      type: 'invidious',
      customUrl: '',
      
      // Public Invidious instances (these change often — user can override)
      invidiousInstances: [
        'https://inv.nadeko.net',
        'https://invidious.nerdvpn.de',
        'https://yewtu.be',
        'https://invidious.f5.si',
        'https://iv.melmac.space'
      ],
      
      // Piped instances
      pipedInstances: [
        'https://pipedapi.kavin.rocks',
        'https://api.piped.yt',
        'https://pipedapi.adminforge.de'
      ],
      
      // Get a random instance from a list
      getRandomInstance(list) {
        return list[Math.floor(Math.random() * list.length)];
      },
      
      // Build the embed URL based on proxy type
      buildEmbedUrl(videoId) {
        if (!this.enabled) return null;
        
        switch(this.type) {
          case 'invidious': {
            const instance = this.getRandomInstance(this.invidiousInstances);
            return `${instance}/embed/${videoId}?autoplay=1&mute=1&local=true`;
          }
          case 'piped': {
            const instance = this.getRandomInstance(this.pipedInstances);
            // Piped embed uses a different format
            return `https://piped.video/embed/${videoId}?autoplay=1&muted=1`;
          }
          case 'custom': {
            if (!this.customUrl) return null;
            const base = this.customUrl.replace(/\/$/, '');
            // Try common patterns
            if (base.includes('{id}')) {
              return base.replace('{id}', videoId);
            }
            return `${base}/embed/${videoId}?autoplay=1&mute=1`;
          }
          case 'corsproxy': {
            // CORS proxy typically wraps the YouTube embed
            const target = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&playsinline=1`;
            if (this.customUrl) {
              return `${this.customUrl.replace(/\/$/, '')}/${target}`;
            }
            return null;
          }
          case 'proxyscrape': {
            // ProxyScrape free proxy list - use a fetched proxy
            // Note: This is a placeholder; actual proxy fetching happens asynchronously
            // For now, return a direct embed URL; the proxy will be applied via fetch
            return null; // Handled separately in loadVideos
          }
          default:
            return null;
        }
      },
      
      // Get a direct embed URL (no proxy)
      getDirectEmbedUrl(videoId) {
        return `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&playsinline=1&rel=0`;
      }
    };

    // ----- Fetch ProxyScrape Proxy -----
    async function fetchProxyScrapeProxy() {
      const apiUrl = 'https://api.proxyscrape.com/v4/free-proxy-list/get?request=display_proxies&proxy_format=protocolipport&format=csv';
      try {
        const response = await fetch(apiUrl);
        const text = await response.text();
        // Parse CSV: format is protocol,ip,port
        const lines = text.trim().split('\n');
        if (lines.length < 2) throw new Error('No proxies returned');
        
        // Skip header if present, filter for http/https proxies
        const proxies = [];
        for (let i = 0; i < lines.length; i++) {
          const parts = lines[i].split(',');
          if (parts.length >= 3) {
            const protocol = parts[0].trim().toLowerCase();
            const ip = parts[1].trim();
            const port = parts[2].trim();
            if (protocol === 'http' || protocol === 'https') {
              proxies.push(`${protocol}://${ip}:${port}`);
            }
          }
        }
        
        if (proxies.length === 0) throw new Error('No valid HTTP proxies found');
        return proxies[Math.floor(Math.random() * proxies.length)];
      } catch (error) {
        console.error('ProxyScrape fetch error:', error);
        return null;
      }
    }

    // ----- URL / ID Extraction -----
    function extractVideoID(url) {
      if (!url) return null;
      url = url.trim();
      
      const patterns = [
        /(?:youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
        /(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/,
        /(?:youtube\.com\/watch\?v=)([a-zA-Z0-9_-]{11})/,
        /(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
        /(?:youtube\.com\/v\/)([a-zA-Z0-9_-]{11})/
      ];

      for (let pattern of patterns) {
        const match = url.match(pattern);
        if (match && match[1]) return match[1];
      }

      if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
      return null;
    }

    // ----- YouTube IFrame API -----
    function onYouTubeIframeAPIReady() {
      ytApiReady = true;
      console.log('YouTube IFrame API ready');
    }

    // ----- Proxy UI Update -----
    function updateProxyStatus() {
      const useProxy = document.getElementById('useProxy').checked;
      const statusEl = document.getElementById('proxyStatus');
      const typeEl = document.getElementById('proxyType');
      const customEl = document.getElementById('customProxy');

      PROXY_CONFIG.enabled = useProxy;
      PROXY_CONFIG.type = typeEl.value;
      PROXY_CONFIG.customUrl = customEl.value.trim();

      if (useProxy) {
        statusEl.className = 'proxy-status active';
        const typeLabel = typeEl.options[typeEl.selectedIndex].text;
        statusEl.innerHTML = `<i class="fas fa-circle" style="font-size: 0.5rem;"></i> Proxy ON · ${typeLabel}`;
      } else {
        statusEl.className = 'proxy-status';
        statusEl.innerHTML = `<i class="fas fa-circle" style="font-size: 0.5rem;"></i> Proxy disabled`;
      }

      // Show/hide custom URL field
      const customLabel = customEl.previousElementSibling;
      if (typeEl.value === 'custom' || typeEl.value === 'corsproxy') {
        customEl.style.display = 'block';
        customLabel.style.display = 'block';
      } else {
        customEl.style.display = 'none';
        customLabel.style.display = 'none';
      }
    }

    // ----- Load Players -----
    async function loadVideos() {
      if (!ytApiReady) {
        setTimeout(loadVideos, 300);
        return;
      }

      const urlInput = document.getElementById('videoURL').value.trim();
      const videoId = extractVideoID(urlInput);
      
      if (!videoId) {
        alert('❌ Please enter a valid YouTube video or Shorts URL.');
        return;
      }

      let count = parseInt(document.getElementById('numVideos').value);
      count = Math.min(Math.max(count, 1), 20);

      // Read proxy settings
      updateProxyStatus();

      const container = document.getElementById('players');
      container.innerHTML = '';
      
      // Destroy old players
      players.forEach(p => {
        if (p && typeof p.destroy === 'function') {
          try { p.destroy(); } catch(e) {}
        }
      });
      players = [];

      // Determine if we're using proxy iframe mode
      const useProxyIframe = PROXY_CONFIG.enabled;
      let proxyEmbedUrl = useProxyIframe ? PROXY_CONFIG.buildEmbedUrl(videoId) : null;
      
      // Special handling for ProxyScrape
      let proxyScrapeUrl = null;
      if (useProxyIframe && PROXY_CONFIG.type === 'proxyscrape') {
        const proxy = await fetchProxyScrapeProxy();
        if (proxy) {
          // Use the proxy to fetch the YouTube embed page
          // Format: http://proxy/... or use as a CORS proxy
          proxyScrapeUrl = proxy;
          console.log('Using ProxyScrape proxy:', proxyScrapeUrl);
        } else {
          console.warn('Could not fetch ProxyScrape proxy, falling back to direct');
        }
      }

      const directEmbedUrl = PROXY_CONFIG.getDirectEmbedUrl(videoId);

      for (let i = 0; i < count; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'player-container';
        wrapper.id = 'player-wrapper-' + i;

        // Add proxy tag if enabled
        if (useProxyIframe) {
          const tag = document.createElement('div');
          tag.className = 'proxy-tag';
          tag.textContent = PROXY_CONFIG.type === 'proxyscrape' ? 'PROXYSCRAPE' : 'PROXY';
          wrapper.appendChild(tag);
        }

        if (useProxyIframe && PROXY_CONFIG.type === 'proxyscrape' && proxyScrapeUrl) {
          // Use ProxyScrape proxy - create an iframe with proxied URL
          // Since we can't directly proxy an iframe easily, we'll use the proxy
          // as a CORS proxy to fetch the YouTube embed page
          // Note: This is experimental; most free proxies won't handle iframe proxying well
          const iframe = document.createElement('iframe');
          iframe.width = '320';
          iframe.height = '180';
          // Try to use the proxy as a CORS proxy for the YouTube embed
          // Format: http://proxy/https://www.youtube.com/embed/...
          const targetUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&playsinline=1`;
          iframe.src = `${proxyScrapeUrl}/${targetUrl}`;
          iframe.frameBorder = '0';
          iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
          iframe.allowFullscreen = true;
          iframe.style.display = 'block';
          wrapper.appendChild(iframe);
          container.appendChild(wrapper);
          
          players[i] = { iframe, isProxy: true };
        } else if (useProxyIframe && proxyEmbedUrl) {
          // Use a plain iframe with the proxy URL (no YT API)
          const iframe = document.createElement('iframe');
          iframe.width = '320';
          iframe.height = '180';
          iframe.src = proxyEmbedUrl;
          iframe.frameBorder = '0';
          iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
          iframe.allowFullscreen = true;
          iframe.style.display = 'block';
          wrapper.appendChild(iframe);
          container.appendChild(wrapper);
          
          // Store iframe reference (no YT.Player object)
          players[i] = { iframe, isProxy: true };
        } else {
          // Standard YT.Player
          const playerDiv = document.createElement('div');
          playerDiv.id = 'player-' + i;
          wrapper.appendChild(playerDiv);
          container.appendChild(wrapper);

          players[i] = new YT.Player(playerDiv.id, {
            height: '180',
            width: '320',
            videoId: videoId,
            playerVars: {
              autoplay: 1,
              controls: 1,
              mute: 1,
              modestbranding: 1,
              playsinline: 1,
              rel: 0,
              showinfo: 0,
              iv_load_policy: 3
            },
            events: {
              onReady: (event) => {
                event.target.mute();
                event.target.playVideo();
              },
              onStateChange: (event) => {
                if (event.data === YT.PlayerState.PAUSED) {
                  setTimeout(() => {
                    try { event.target.playVideo(); } catch(e) {}
                  }, 500);
                }
                if (event.data === YT.PlayerState.ENDED) {
                  try { event.target.seekTo(0); event.target.playVideo(); } catch(e) {}
                }
              },
              onError: (event) => {
                console.error('Player error:', event.data);
              }
            }
          });
        }
      }

      // Info pill
      const oldPill = document.querySelector('.info-pill');
      if (oldPill) oldPill.remove();
      
      const info = document.createElement('div');
      info.className = 'info-pill';
      let proxyLabel = '';
      if (useProxyIframe) {
        if (PROXY_CONFIG.type === 'proxyscrape') {
          proxyLabel = ` · <i class="fas fa-shield-halved"></i> via ProxyScrape (${proxyScrapeUrl || 'no proxy found'})`;
        } else {
          proxyLabel = ` · <i class="fas fa-shield-halved"></i> via ${PROXY_CONFIG.type}`;
        }
      }
      info.innerHTML = `<i class="fas fa-check-circle"></i> Loaded ${count} player${count > 1 ? 's' : ''} · ID: ${videoId}${proxyLabel}`;
      document.querySelector('.input-group').appendChild(info);
    }

    // ----- Event Listeners -----
    document.getElementById('loadBtn').addEventListener('click', loadVideos);
    
    document.getElementById('useProxy').addEventListener('change', updateProxyStatus);
    document.getElementById('proxyType').addEventListener('change', updateProxyStatus);
    document.getElementById('customProxy').addEventListener('input', updateProxyStatus);

    document.getElementById('videoURL').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadVideos();
    });
    document.getElementById('numVideos').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadVideos();
    });

    // Shorts badge in label
    document.getElementById('videoURL').addEventListener('input', (e) => {
      const url = e.target.value;
      const isShort = url.includes('/shorts/');
      const label = document.querySelector('label[for="videoURL"]');
      if (isShort) {
        label.innerHTML = '<i class="fas fa-link"></i> YouTube Shorts URL: <span class="short-badge" style="font-size:0.6rem;">SHORTS</span>';
      } else {
        label.innerHTML = '<i class="fas fa-link"></i> YouTube Video URL:';
      }
    });

    // Initialize proxy UI
    window.addEventListener('load', () => {
      updateProxyStatus();
      
      const tryLoad = () => {
        if (ytApiReady) {
          loadVideos();
        } else {
          setTimeout(tryLoad, 200);
        }
      };
      tryLoad();
    });
  </script>

</body>
</html>
